# /etc/nginx/includes/gn_headers.conf — cabeçalhos de segurança do GambleNumbers.
# Incluído no server E em cada location que tem add_header próprio: no nginx, um add_header
# dentro de location anula TODOS os add_header herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
