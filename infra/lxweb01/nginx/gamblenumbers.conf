# Trecho do /etc/nginx/conf.d/sites.conf do lxweb01 (só o server do GambleNumbers).
# SITE 2: GambleNumbers
# =========================================================
# Rate limiting: API pública limitada a 60 req/min por IP
limit_req_zone $binary_remote_addr zone=gn_api:10m rate=60r/m;

# CSP das páginas HTML: só o app PWA (/app/) recebe, porque o site principal ainda tem
# onclick inline (identity.js) que a CSP bloquearia. Valor vazio = nginx não envia o header.
map $uri $gn_csp_html {
    ~^/app/  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    default  "";
}

server {
    listen 80;
    server_name gamblenumbers.com www.gamblenumbers.com;

    # Raiz deste site específico
    # Publica APENAS a subpasta public/. Tudo que o site precisa continua
    # dentro de /usr/share/nginx/html/gamblenumbers (public/, private/, dev/),
    # mas só public/ é alcançável por URL — private/ (credenciais) e dev/
    # (testes) ficam ACIMA da raiz, inacessíveis por construção.
    root /usr/share/nginx/html/gamblenumbers/public;

    # HTTPS forçado: se o request chegou via HTTP (header injetado pelo Cloudflare),
    # redireciona para HTTPS. Funciona corretamente atrás do Cloudflare Flexible SSL.
    # Exceção: challenge ACME não redireciona (necessário para renovação de cert).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Exceção ACME (Let's Encrypt) — deve vir ANTES das regras de negação
    location ^~ /.well-known/acme-challenge/ { allow all; }

    location = /clear-storage.json {
        add_header Clear-Site-Data "\"storage\"" always;
        add_header Content-Type "application/json";
    }
    client_max_body_size 128M;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: força HTTPS por 1 ano no browser (só ativo quando servido via HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: restringe origens de scripts/estilos/conexões
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    # Bloqueia acesso a recursos de câmera/microfone/geolocalização
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache control: index.html nunca cacheado (sempre fresco do servidor)
    # JS/CSS com ?v= são cacheados por 1 ano (cache-busting via query string)
    # (cada location com add_header precisa repetir o include gn_headers.conf)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/includes/gn_headers.conf;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy $gn_csp_html always;
        include /etc/nginx/includes/gn_headers.conf;
    }
    # Service worker do app: nunca cache longo (nem no Cloudflare), senão o app não atualiza.
    location = /app/sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/includes/gn_headers.conf;
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/includes/gn_headers.conf;
    }

    # Rate limiting na API
    location ~ ^/(api|textos)\.php$ {
        limit_req zone=gn_api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/includes/enable_php.conf;
    }

    # Nega arquivos que nunca devem ser servidos (backups, fontes, ocultos)
    location ~* \.(bak|old|orig|save|swp|dist|sql|log|ini|sh) { deny all; }
    location ~* \.(test|spec)\.js$ { deny all; }
    location ~ /\. { deny all; }
    location ~ ~$ { deny all; }

    # Proteção
    include /etc/nginx/includes/honeypot_rules.conf;

    # PHP geral
    include /etc/nginx/includes/enable_php.conf;

    location ~ ^/private {
        deny all;
        return 403;
    }

    location / {
        index index.php index.html;
        try_files $uri $uri/ =404;
    }
}

